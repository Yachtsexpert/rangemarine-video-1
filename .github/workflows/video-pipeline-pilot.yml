name: Video pipeline pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install Pillow google-api-python-client google-auth
      - name: Render approved technical fixture
        run: python automation/scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-mp4-and-qa
          path: |
            automation/pilot/output/pilot.mp4
            automation/pilot/output/qa.json
      - id: gcp-auth
        name: Authenticate to Google Cloud with GitHub OIDC
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.GDRIVE_FOLDER_ID != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.file
      - name: Upload to Google Drive and verify
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python automation/scripts/upload_drive.py
